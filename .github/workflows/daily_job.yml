name: Daily Hinge Insights Job

on:
  schedule:
    - cron: '0 0 * * *'  # 每天台灣時間早上 8:00 (UTC 0:00)
  workflow_dispatch:      # 允許你隨時手動點擊按鈕測試

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install google-genai requests

      - name: Run AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py
